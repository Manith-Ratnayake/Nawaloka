dashscope:
  base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  rerank_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/reranks"

opensearch:
  index: "nawaloka"

embedding:
  model: "text-embedding-v4"
  dimension: 1024

retrieval:
  top_k: 12

reranker:
  model: "qwen3-rerank"
  top_n: 7

query_agent:
  model: "qwen3.7-flash"
  max_subqueries: 4

sql_agent:
  model: "qwen3.7-flash"

faq_cache:
  similarity_threshold: 0.88
  key_prefix: "faq:"
  index_key: "faq:index"
